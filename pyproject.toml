[project]
name = "sentinel-ops"
version = "0.2.0"
description = "Approval-gated MCP incident response tools for Dockerized services"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "docker>=7.1.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.11.0"]

[project.scripts]
sentinel-ops = "sentinel_ops.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinel_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
